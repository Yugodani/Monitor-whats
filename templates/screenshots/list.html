{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <h2>Screenshots ({{ total }})</h2>

    <div class="row">
        {% for screenshot in screenshots %}
        <div class="col-md-3 mb-3">
            <div class="card">
                <img src="{{ screenshot.image.url }}" class="card-img-top">
                <div class="card-body">
                    <p>{{ screenshot.device.device_name }}</p>
                    <small>{{ screenshot.timestamp }}</small>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
